# deploy-kit Project Intent for hermes, the agent that runs the estate's loops and cron jobs from
# the cluster (agent-kit#911). Models come only from LiteLLM, through one virtual key per tier; the
# pod holds no subscription login and no provider key.
#
# The pod is the sandbox:
#   - no host mounts: the only volumes are the emptyDirs named by writablePaths below;
#   - a throwaway clone: /work is an emptyDir, empty at every start and gone with the pod;
#   - non-root and a read-only root filesystem: deploy-kit's hardening posture, with the image's own
#     unprivileged user (uid 10001) and /tmp, /work and /home/hermes as the only writable paths;
#   - egress: the edge to litellm below (an in-cluster Service) and two named public hosts,
#     api.github.com and github.com on 443, reached only through the Process's own allowlisting proxy
#     (deploy-kit 1.12.0, host-narrowed egress; see `egress` and the residual risk).
#
# Residual risk: this pod reads untrusted content (pull requests of public repositories) while it holds
# tier keys in its environment and can reach every public address. A prompt injection could send a key
# out, to GitHub or through it. The bounds are the host allowlist (a key cannot be sent to any other
# host), tier-scoped, budgeted keys and the absence of any GitHub credential. The proxy decides by
# name and the DNS of the cluster stays reachable, so a covert channel in DNS queries remains.
#
# Hermes's idle process only holds the sandbox open. Loops (the Renovate repair loop first) arrive
# as `lifecycle: scheduled` processes of this Application, each running `hermes chat -q`.

apiVersion: intent.jorisjonkers.dev/v1
kind: Project
schemaVersion: 1.0.0

project: hermes # the namespace derives: hermes-system
owner: joris

applications:
  - id: hermes
    processes:
      - name: hermes
        lifecycle: application
        image: hermes # ghcr.io/jorisjonkers-dev/hermes; the lock resolves digest, uid and gid
        runtime: none # Hermes exports no telemetry of its own; the serving-model lines go to stdout
        # `args`, never `command`: `command` replaces the image ENTRYPOINT (tini, then the entrypoint that
        # renders config.yaml and refuses to start without the tier providers), `args` replaces only CMD.
        args: [sleep, infinity]
        probes: none

        # LiteLLM in the cluster: the edge derives the egress rule to its Service and hands the pod
        # its host and port (LITELLM_HOST, LITELLM_PORT in env/hermes/base.env).
        dependsOn:
          - { application: litellm, surface: http }

        # GitHub: the clone, the pushes and the pull requests of a loop. The Process may reach these
        # two hosts on 443 and nothing else public: deploy-kit derives an allowlisting proxy for it
        # (`hermes-egress`), points HTTPS_PROXY at it, keeps the cluster's names and the LiteLLM edge
        # on NO_PROXY, and applies the policy pair that leaves the pod no other public route.
        egress:
          reason: >-
            Clones the public repositories a loop works on from GitHub, and pushes and opens pull requests there. No other host is called: models come from LiteLLM, over the edge above.
          hosts:
            - { host: api.github.com, port: 443 }
            - { host: github.com, port: 443 }

        secrets:
          # Placeholder names: the owner writes the values with estate bootstrap/secrets.sh.
          # Each tier key is a LiteLLM virtual key holding that tier's chain and nothing else
          # (agent-kit registry/estate-tooling.yaml, litellm catalog/routing.json `key_models`).
          # litellm_tier_strong_open_key is the escalation key: leave it out of the secret and
          # tier-strong-open is simply refused by the proxy.
          # Each key should be minted with a budget (litellm max_budget): the keys are in this process's
          # environment, so a budget bounds a leak.
          # There is deliberately no GitHub token here; see env/hermes/base.env.
          - path: secret/data/hermes/hermes
            keys:
              - litellm_free_key
              - litellm_tier_vibe_key
              - litellm_tier_go_cheap_key
              - litellm_tier_review_key
              - { name: litellm_tier_strong_open_key, optional: true }
            access: read
            delivery: env
            rotation: { tolerates: restart }

        placement:
          memory: 1Gi
          cpu: 250m

        # HERMES_HOME (/home/hermes/.hermes) seeded by the entrypoint, git's and Python's scratch,
        # and the throwaway clone directory. Each is an emptyDir.
        writablePaths: [/tmp, /home/hermes, /work]

        cutover: continuous
