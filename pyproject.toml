[project]
name = "hermes-deployment"
version = "0.0.0"
description = "Tests for the hosted Hermes delegation plugin. Not a published package."
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.coverage.run]
branch = true
source = ["plugins/delegation-litellm-tiers", "docker"]

[tool.coverage.report]
fail_under = 100
show_missing = true
